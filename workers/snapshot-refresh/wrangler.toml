name = "anime-role-grid-snapshot-refresh"
main = "src/index.ts"
compatibility_date = "2024-11-20"

# 每天刷新一次快照（UTC 00:15，即北京时间 08:15）
#
# 为什么是 UTC 00:15 而不是 00:00：
#   D1 免费额度按 UTC 日重置，撞在重置那一瞬间可能因计数尚未清零而失败，
#   而失败后要再等一整个周期。往后错 15 分钟留出余量。
#
# 为什么是每天一次（实测数据定的，不是估算）：
#   热榜聚合  1,820,445 行（4 个周期合并成一次扫描的实测值）
#   热门模板     63,039 行
#   投票统计   ~850,000 行（按模板扫，每个 item 只读一次）
#   ─────────────────────────────
#   单次刷新 ≈ 2.73M 行，而免费额度是 5,000,000 行/天。
#     每 12 小时 → 2 次 ≈ 5.46M  ❌ 超
#     每天      → 1 次 ≈ 2.73M  ✅ 55%，留有余量
#
#   24 小时的新鲜度是否可接受？站点每天只新增约 188 条 item（共 79 万条），
#   榜单排名变化极慢；且前端默认展示的是「周榜」（7~8 天窗口），
#   多出半天的数据对排名几乎无影响。
#
# 后续若要提高频率，先做这两步（可把单次成本降到 ~1.8M）：
#   1. 加 idx_saves_created_at，把周/日窗口改成从 saves 侧驱动（降到千行级）
#   2. 剩下单次全扫只用于 all-time 榜，再按半天/一天独立刷新
[triggers]
crons = ["15 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "anime-grid-db"
database_id = "6f0fb911-3611-4626-8ee2-7c2471375897"
