name = "anime-role-grid-snapshot-refresh"
main = "src/index.ts"
compatibility_date = "2024-11-20"

# 每 12 小时刷新一次快照
#
# 为什么是 UTC 00:15 / 12:15 而不是 00:00 / 12:00：
#   D1 免费额度按 UTC 日重置，而 `0 */12` 会正好撞在重置那一瞬间，
#   可能因计数尚未清零而失败（失败后要等 12 小时才有下一次）。
#   往后错 15 分钟留出余量。（北京时间 08:15 / 20:15）
#
# 为什么是 12 小时而不是更短：
#   一次完整刷新约读 1.5M 行（热榜聚合扫 568k，投票统计按模板扫约 791k，另有 saves 扫描），
#   而 D1 免费额度是 5,000,000 行/天。
#     每 6 小时 → 4 次 ≈ 6.0M  ❌ 超
#     每 12 小时 → 2 次 ≈ 3.0M ✅ 60%，留有余量
#   而站点每天只新增约 188 条 item，「全站热门」榜单本身变化极慢，
#   12 小时的新鲜度用户完全无感。
[triggers]
crons = ["15 0,12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "anime-grid-db"
database_id = "6f0fb911-3611-4626-8ee2-7c2471375897"
